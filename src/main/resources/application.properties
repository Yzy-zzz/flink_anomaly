# 提示：本项目的 5 分钟窗口由 DorisPollingAlertSource 手工推进，不是 Flink window() API。
# type=2 排查时优先看 baseline_source / bytes_threshold / pair_learning_mode。
# 详细解释见 docs/BEGINNER_CODE_AND_ALGORITHM_GUIDE_CN.md。

# ================================================================
# NetTrafficSentinel - continuous runtime configuration
# Flink 1.17.2 / Java 8 or 11 / Doris 2.1.x
# ================================================================

# ---------------- Job ----------------
job.name=NET-TRAFFIC-ANOMALY
business.timezone=Asia/Shanghai
window.size.minutes=5

# ---------------- Doris data-watermark polling ----------------
# latest_data: on a brand-new job, start from the newest mature Doris 5-minute window.
# fixed: start from source.start.time and catch up window by window.
# A restored Flink checkpoint/savepoint cursor always has priority.
source.start.mode=latest_data
source.start.time=2026-08-15 00:00:00

# Main idle loop while cursor has caught up to the safe Doris watermark.
source.poll.interval.seconds=15

# Query MAX(collectTime) every N seconds to learn Doris's real data progress.
source.watermark.poll.interval.seconds=60
source.watermark.query.timeout.seconds=120
# Search recent dayTime partitions for MAX(collectTime). Increase only if Doris can lag by more days.
source.watermark.lookback.days=3
# Because MAX(collectTime) does not prove earlier rows are complete, wait an additional safety period.
source.doris.stable.delay.minutes=60

# IMPORTANT for this high-volume table: when a supposedly mature window still has zero rows,
# keep the same cursor and retry it later instead of permanently skipping late-arriving data.
source.empty.window.advance=false
source.empty.window.retry.seconds=300

# Temporary SQL/network failures also retry the SAME window.
source.retry.interval.seconds=30
source.retry.max.failures=10
source.progress.log.rows=1000000
# This version intentionally performs one ordered Doris polling stream.
source.parallelism=1

# ---------------- Doris JDBC ----------------
doris.jdbc.url=jdbc:mysql://10.166.10.37:9030/?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&zeroDateTimeBehavior=CONVERT_TO_NULL
doris.table=anomaly_detection.metric_endpoint
doris.username=root
doris.password=QD_Hzx@2026!
doris.jdbc.streaming.enabled=true
doris.jdbc.fetch.size=5000
doris.jdbc.query.timeout.seconds=1800

# ---------------- Rule: anomalyType=2 large traffic ----------------
rule.large.enabled=true
rule.large.bytes.quantile=0.999
rule.large.pkts.quantile=0.999
rule.large.bytes.baseline.multiplier=4.0
rule.large.pkts.baseline.multiplier=4.0
rule.large.extreme.multiplier=2.0
# Only the largest records of each 5-minute window are retained as pair candidates.
rule.large.candidate.capacity=20000
rule.large.tdigest.compression=200.0

# ---------------- Historical Context Sketch ----------------
# Context = protocol + WORKDAY/WEEKEND + time-slot. It does NOT store IP pairs.
history.context.enabled=true
history.context.retention.days=7
history.context.slot.minutes=5
# Require at least this many previous dates before using historical context thresholds.
# Before that, type=2 temporarily falls back to the current window distribution.
history.context.min.days=2
history.context.tdigest.compression=100.0

# ---------------- Historical Pair EMA ----------------
# Pair history stores only bounded heavy candidates as a compact 64-bit pair hash.
history.pair.enabled=true
# Event-time TTL: a pair not learned again for 7 data-days is considered expired.
history.pair.ttl.days=7
# Hard memory cardinality cap. Oldest-updated pairs are evicted when the cap is exceeded.
history.pair.max.entries=200000
# EMA: new = old*(1-alpha) + current*alpha
history.pair.ema.alpha=0.10
# Use pair EMA as baseline only after at least N bounded learned samples.
history.pair.min.samples=3
# During pair bootstrap, learn anomalous samples only after capping them at the effective context high-quantile threshold.
history.pair.bootstrap.anomaly.capped.learning.enabled=true

# ---------------- Rule: anomalyType=3 off-hours Top N ----------------
rule.offhours.enabled=true
rule.offhours.topn=100
rule.offhours.sketch.capacity=2048
rule.offhours.weekday.start.hour=20
rule.offhours.weekday.end.hour=8

# ---------------- Alert ----------------
alert.logid=STATIC_NET_TRAFFIC_ALERT
alert.vendorCode=V001
alert.remark1=
alert.remark2=
alert.output.log.enabled=true
alert.output.kafka.enabled=false

# ---------------- Kafka ----------------
kafka.bootstrap.servers=localhost:9092
kafka.topic=anomaly_alert
kafka.delivery.guarantee=at_least_once
kafka.transactional.id.prefix=net-traffic-anomaly-

# ---------------- Checkpoint / recovery ----------------
# Cursor + Context Sketch buckets + Pair EMA history are checkpointed.
checkpoint.enabled=true
# Historical state is larger than the previous version; five minutes is a safer default than every minute.
checkpoint.interval.ms=300000
checkpoint.timeout.ms=600000
checkpoint.min.pause.ms=30000
# PRODUCTION: configure a real HDFS path reachable by every YARN container.
# Example: hdfs:///flink-checkpoints/net-traffic-sentinel
checkpoint.storage.path=
restart.attempts=20
restart.delay.seconds=10

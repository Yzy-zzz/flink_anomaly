# ================================================================
# NetTrafficSentinel - Kafka input edition
# Flink 1.17.2 / Java 8 or 11
# Input : Kafka topic METRIC-ENDPOINT
# Output: Kafka topic anomaly_alert (same Kafka cluster by default)
# ================================================================

# ---------------- Job ----------------
job.name=NET-TRAFFIC-ANOMALY
business.timezone=Asia/Shanghai
window.size.minutes=5

# ---------------- Kafka cluster / Kerberos ----------------
# Input and output share this broker list and security configuration.
kafka.bootstrap.servers=QD010GJK008:9092,QD010GJK009:9092,QD010GJK010:9092,QD010GJK011:9092,QD010GJK012:9092
kafka.security.protocol=SASL_PLAINTEXT
kafka.sasl.kerberos.service.name=kafka
kafka.sasl.mechanism=GSSAPI

# ---------------- Kafka input ----------------
kafka.input.topic=METRIC-ENDPOINT
# IMPORTANT: this group.id must be unique to NetTrafficSentinel. Do not reuse another Flink job's group.id.
kafka.input.group.id=net-traffic-sentinel-metric-endpoint-v1
kafka.input.client.id.prefix=net-traffic-sentinel-input

# Start position for a brand-new deployment:
#   latest    = only new records after startup (safe default)
#   earliest  = read all retained records from the beginning
#   committed = resume this group.id's committed offsets; if none exist use the reset policy below
#   timestamp = start at the first offsets whose record timestamp is >= kafka.input.start.timestamp
# Checkpoint restore always takes priority over these initial-offset settings.
kafka.input.start.mode=latest
kafka.input.start.timestamp=2026-08-24 00:00:00
kafka.input.committed.offset.reset=earliest

# Unknown delayed/out-of-order records are handled using collectTime event time.
# Default waits 6 hours before a 5-minute window is considered complete.
# Increase this if real Kafka delay can exceed 6 hours. Increasing it also keeps more open-window
# summaries in memory/checkpoints and delays alert emission by the same amount.
kafka.input.max.out.of.orderness.minutes=5
# Mark a completely idle source subtask idle so it does not block the global watermark.
# If one source subtask owns multiple partitions, idleness is at subtask level after JSON parsing, not per-partition.
# This does not force watermarks forward when the entire topic stops producing new event-time data.
kafka.input.watermark.idle.timeout.minutes=2

# Source parallelism: 0 = auto from actual topic partition count, capped by the max below.
# If the topic really has one partition, startup logs will show partitions=1 and source parallelism=1.
kafka.input.source.parallelism=0
kafka.input.source.parallelism.max=4
kafka.input.max.poll.records=5000
kafka.input.request.timeout.ms=30000
kafka.input.session.timeout.ms=45000
kafka.input.heartbeat.interval.ms=15000
kafka.input.commit.offsets.on.checkpoint=true
kafka.input.partition.discovery.interval.ms=60000

# Startup preflight: broker/topic metadata + actual partition count + READ/group authorization.
# The probe checks topic READ and group offset authorization without joining/rebalancing the group and never commits offsets.
kafka.input.connection.check.enabled=true
kafka.input.connection.timeout.ms=15000
kafka.input.connection.fail-fast=true

# ---------------- Rule: anomalyType=2 large traffic ----------------
rule.large.enabled=true
rule.large.bytes.quantile=0.999
rule.large.pkts.quantile=0.999
rule.large.bytes.baseline.multiplier=4.0
rule.large.pkts.baseline.multiplier=4.0
rule.large.extreme.multiplier=2.0
rule.large.candidate.capacity=20000
rule.large.tdigest.compression=200.0

# ---------------- Historical Context Sketch ----------------
history.context.enabled=true
history.context.retention.days=7
history.context.slot.minutes=5
history.context.min.days=2
history.context.tdigest.compression=100.0

# ---------------- Historical Pair EMA ----------------
history.pair.enabled=true
history.pair.ttl.days=7
history.pair.max.entries=200000
history.pair.ema.alpha=0.10
history.pair.min.samples=3
history.pair.bootstrap.anomaly.capped.learning.enabled=true

# ---------------- Rule: anomalyType=3 off-hours Top N ----------------
rule.offhours.enabled=true
rule.offhours.topn=100
rule.offhours.sketch.capacity=2048
rule.offhours.weekday.start.hour=20
rule.offhours.weekday.end.hour=8

# ---------------- Alert ----------------
# logId = yyyyMMdd + 6-digit device ID + 18-digit daily sequence.
# Set a unique 6-digit ID for each independently deployed instance.
alert.device.id=123456
alert.vendorCode=V001
alert.remark1=
alert.remark2=
alert.output.log.enabled=false
alert.output.kafka.enabled=true

# ---------------- Kafka output ----------------
kafka.output.topic=ANOMALY-ALERT
kafka.output.delivery.guarantee=at_least_once
kafka.output.transactional.id.prefix=net-traffic-anomaly-
kafka.output.client.id=net-traffic-sentinel-alert

# Output-side metadata/authentication probe and producer delivery monitoring.
kafka.monitor.connection.check.enabled=true
kafka.monitor.connection.timeout.ms=10000
kafka.monitor.connection.fail-fast=false
kafka.monitor.delivery.log.enabled=true
kafka.monitor.delivery.summary.interval.ms=300000
kafka.monitor.delivery.per-record.log.enabled=false

# ---------------- Checkpoint / recovery ----------------
# Kafka offsets + open delayed windows + Context history + Pair EMA + logId sequence are checkpointed.
checkpoint.enabled=true
checkpoint.interval.ms=300000
# Open delayed windows make checkpoints larger than the old Doris version; allow a longer timeout.
checkpoint.timeout.ms=900000
checkpoint.min.pause.ms=30000
checkpoint.storage.path=hdfs:///flink-checkpoints/net-traffic-sentinel-kafka
restart.attempts=20
restart.delay.seconds=10

# Old Doris source state is intentionally not migrated. Keep false.
migration.restore.old.doris.state=false
